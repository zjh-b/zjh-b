<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 254" width="960" height="254" role="img" aria-labelledby="title description">
  <title id="title">zjh-b</title>
  <desc id="description">手绘字标和一颗沿轨道运动的薄荷绿卫星。</desc>
  <style>
    svg {
      --paper: #f2edfc;
      --ink: #23163a;
      --accent: #6339a0;
      --rule: #ddd0f1;
      --grid: #cfbee8;
      --glow: #d8c4f8;
      --mint: #187b67;
      --core: #e2d5f7;
      --core-edge: #7752ae;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #181128;
        --ink: #f7efff;
        --accent: #bb9bf5;
        --rule: #37294e;
        --grid: #45335f;
        --glow: #463070;
        --mint: #77f6dc;
        --core: #392658;
        --core-edge: #ad88ec;
      }
    }
    .satellite {
      offset-path: path('M 631 159 C 615 130 655 83 720 57 C 785 31 851 33 867 62 C 883 91 843 138 778 164 C 713 190 647 188 631 159 Z');
      offset-rotate: 0deg;
      animation: orbit 8s linear 2;
    }
    @keyframes orbit {
      to { offset-distance: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .satellite { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="frame"><rect width="960" height="254" rx="18"/></clipPath>
    <radialGradient id="orbital-glow">
      <stop stop-color="var(--glow)"/>
      <stop offset="1" stop-color="var(--glow)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--grid)"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="254" fill="var(--paper)"/>
    <rect x="494" y="0" width="466" height="254" fill="url(#dots)"/>
    <ellipse cx="751" cy="120" rx="222" ry="142" fill="url(#orbital-glow)"/>

    <g fill="none" stroke="var(--rule)">
      <path d="M 48 42 H 470 M 48 212 H 910 M 497 42 H 910"/>
      <path d="M 498 42 V 212"/>
    </g>
    <g fill="var(--accent)">
      <circle cx="48" cy="42" r="2"/><circle cx="48" cy="212" r="2"/>
      <circle cx="910" cy="42" r="2"/><circle cx="910" cy="212" r="2"/>
    </g>

    <!-- Custom geometric letterforms in the account name. -->
    <g fill="var(--ink)" transform="translate(56 75)">
      <path d="M 0 32 H 66 V 47 L 26 93 H 67 V 110 H 0 V 95 L 41 49 H 0 Z"/>
      <path d="M 88 32 H 108 V 106 Q 108 132 82 132 H 74 V 115 H 80 Q 88 115 88 106 Z M 88 5 H 108 V 24 H 88 Z"/>
      <path d="M 125 5 H 146 V 42 Q 154 30 171 30 Q 195 30 195 59 V 110 H 175 V 63 Q 175 48 162 48 Q 146 48 146 64 V 110 H 125 Z"/>
      <path d="M 213 65 H 249 V 81 H 213 Z"/>
      <path fill-rule="evenodd" d="M 268 5 H 289 V 42 Q 298 30 315 30 Q 347 30 347 71 Q 347 112 315 112 Q 298 112 288 100 V 110 H 268 Z M 289 71 Q 289 94 308 94 Q 326 94 326 71 Q 326 48 308 48 Q 289 48 289 71 Z"/>
    </g>
    <path d="M 425 174 H 445" stroke="var(--mint)" stroke-width="9"/>

    <g fill="none" stroke="var(--core-edge)">
      <ellipse cx="749" cy="111" rx="149" ry="69" transform="rotate(20 749 111)" opacity=".43" stroke-dasharray="2 7"/>
      <ellipse cx="749" cy="111" rx="163" ry="57" opacity=".38"/>
      <path d="M 631 159 C 615 130 655 83 720 57 C 785 31 851 33 867 62 C 883 91 843 138 778 164 C 713 190 647 188 631 159 Z" opacity=".85"/>
    </g>
    <g stroke="var(--core-edge)" stroke-width="1.4" stroke-linejoin="round">
      <path d="M 749 61 L 793 90 V 136 L 749 162 L 705 136 V 90 Z" fill="var(--core)"/>
      <path d="M 749 61 L 765 108 L 749 162 L 733 108 Z" fill="var(--paper)"/>
      <path d="M 705 90 L 749 116 L 793 90 M 705 136 L 749 116 L 793 136 M 749 61 V 162" fill="none"/>
    </g>
    <g fill="var(--accent)">
      <path d="M 588 70 H 596 V 72 H 588 Z M 591 67 H 593 V 75 H 591 Z"/>
      <path d="M 896 129 H 904 V 131 H 896 Z M 899 126 H 901 V 134 H 899 Z"/>
      <circle cx="675" cy="58" r="2"/><circle cx="858" cy="164" r="2"/>
    </g>
    <g class="satellite" fill="var(--mint)">
      <circle r="11" fill="none" stroke="var(--mint)" opacity=".45"/>
      <circle r="5.5"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="959" height="253" rx="17.5" fill="none" stroke="var(--rule)"/>
</svg>
